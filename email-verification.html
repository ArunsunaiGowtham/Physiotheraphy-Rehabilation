<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Verify your email address for your PhysioLife patient portal account.">
  <title>Email Verification – PhysioLife Clinic</title>

  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/variables.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/rtl.css" rel="stylesheet">
</head>
<body class="bg-surface-alt d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="text-center mb-4">
          <a href="index.html">
            <img src="assets/images/logo.svg" alt="PhysioLife Logo" height="46">
          </a>
        </div>

        <div class="p-4 p-md-5 bg-surface rounded-4 border border-subtle shadow-sm text-center">
          <div class="service-icon-box mx-auto text-primary bg-primary-subtle mb-3">
            <i class="fas fa-envelope-open-text"></i>
          </div>
          <h3 class="fw-bold mb-1">Verify Your Email</h3>
          <p class="text-muted small mb-4">We sent a 6-digit verification code to <strong>robert@example.com</strong>. Enter it below to activate your account.</p>

          <form action="account-success.html" method="GET">
            <div class="d-flex justify-content-center gap-2 mb-4">
              <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-2" style="width: 46px; height: 52px;" value="8" required>
              <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-2" style="width: 46px; height: 52px;" value="4" required>
              <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-2" style="width: 46px; height: 52px;" value="2" required>
              <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-2" style="width: 46px; height: 52px;" value="9" required>
              <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-2" style="width: 46px; height: 52px;" value="1" required>
              <input type="text" maxlength="1" class="form-control text-center fs-4 fw-bold p-2" style="width: 46px; height: 52px;" value="7" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
              <i class="fas fa-check-circle me-2"></i> Verify Code &amp; Activate
            </button>
          </form>

          <p class="small text-muted mb-0">
            Didn't receive code? <a href="#" class="fw-bold text-primary">Resend Code (54s)</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
