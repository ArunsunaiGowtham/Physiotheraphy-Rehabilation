<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="spineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="16" fill="url(#spineBg)"/>
  
  <!-- Spine Title -->
  <text x="200" y="45" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle">Vertebral Column &amp; Neural Pathways</text>
  <text x="200" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Clinical Assessment Blueprint</text>

  <!-- Cervical Spine (C1-C7) -->
  <g transform="translate(160, 90)">
    <rect x="15" y="0" width="50" height="14" rx="4" fill="#0284C7"/>
    <rect x="10" y="18" width="60" height="14" rx="4" fill="#0284C7"/>
    <rect x="5" y="36" width="70" height="14" rx="4" fill="#0284C7"/>
    <text x="110" y="25" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#0284C7">Cervical (C1 - C7)</text>
    <text x="110" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Neck mobility &amp; headaches</text>
    <line x1="80" y1="25" x2="105" y2="25" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- Thoracic Spine (T1-T12) -->
  <g transform="translate(150, 165)">
    <rect x="15" y="0" width="70" height="15" rx="4" fill="#0F766E"/>
    <rect x="10" y="20" width="80" height="15" rx="4" fill="#0F766E"/>
    <rect x="5" y="40" width="90" height="15" rx="4" fill="#0F766E"/>
    <rect x="10" y="60" width="80" height="15" rx="4" fill="#0F766E"/>
    <rect x="15" y="80" width="70" height="15" rx="4" fill="#0F766E"/>
    <text x="-130" y="45" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#0F766E">Thoracic (T1 - T12)</text>
    <text x="-130" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Posture &amp; ribcage alignment</text>
    <line x1="-10" y1="45" x2="15" y2="45" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- Lumbar Spine (L1-L5) - Highlighted Pain Zone -->
  <g transform="translate(145, 290)">
    <rect x="15" y="0" width="80" height="18" rx="4" fill="#F97316"/>
    <rect x="10" y="24" width="90" height="18" rx="4" fill="#F97316"/>
    <rect x="5" y="48" width="100" height="18" rx="4" fill="#EF4444"/> <!-- Herniated / Pain Focus -->
    <rect x="10" y="72" width="90" height="18" rx="4" fill="#F97316"/>
    <text x="125" y="45" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#EF4444">Lumbar (L1 - L5)</text>
    <text x="125" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Lower back pain &amp; Sciatica</text>
    <line x1="105" y1="52" x2="120" y2="52" stroke="#EF4444" stroke-width="2"/>
    <!-- Pain Indicator Glow -->
    <circle cx="100" cy="57" r="6" fill="#EF4444"/>
  </g>

  <!-- Sacrum & Coccyx -->
  <g transform="translate(165, 400)">
    <polygon points="10,0 60,0 45,40 25,40" fill="#64748B"/>
    <polygon points="27,45 43,45 35,65" fill="#475569"/>
    <text x="-140" y="30" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#475569">Sacrum &amp; Pelvic Base</text>
    <text x="-140" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">SI Joint stabilization</text>
    <line x1="-15" y1="30" x2="15" y2="30" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>
</svg>
