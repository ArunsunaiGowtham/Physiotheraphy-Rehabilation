<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <linearGradient id="exBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#exBg)"/>
  
  <!-- Video Player Preview Interface -->
  <!-- Play Button Center Overlay -->
  <circle cx="250" cy="150" r="38" fill="rgba(20, 184, 166, 0.9)"/>
  <polygon points="244,136 264,150 244,164" fill="#FFFFFF"/>

  <!-- Exercise Silhouette: Cat-Cow Spinal Stretch -->
  <!-- Floor Mat -->
  <rect x="50" y="240" width="400" height="12" rx="6" fill="#0F766E"/>

  <!-- Hands on Floor -->
  <line x1="160" y1="200" x2="160" y2="240" stroke="#FCD34D" stroke-width="12" stroke-linecap="round"/>
  <!-- Knees on Floor -->
  <line x1="330" y1="200" x2="330" y2="240" stroke="#0284C7" stroke-width="14" stroke-linecap="round"/>
  <!-- Curved Spine (Cat Stretch Upward Arch) -->
  <path d="M160 200 C200 130 280 130 330 200" fill="none" stroke="#F97316" stroke-width="14" stroke-linecap="round"/>
  <!-- Head Tucked Down -->
  <circle cx="130" cy="220" r="18" fill="#FCD34D"/>

  <!-- Badges / Video Duration -->
  <rect x="25" y="25" width="130" height="30" rx="6" fill="rgba(255, 255, 255, 0.15)"/>
  <text x="90" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">HD Video Guide</text>
  <rect x="420" y="265" width="60" height="26" rx="4" fill="#000000" opacity="0.8"/>
  <text x="450" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">04:15</text>
</svg>
