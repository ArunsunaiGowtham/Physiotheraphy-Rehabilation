<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <linearGradient id="sportsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="glowTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="sportsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F97316" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- High-Tech Performance Arena Background -->
  <rect width="700" height="500" rx="24" fill="url(#sportsBg)"/>
  
  <!-- Cyber Grid Lines -->
  <line x1="0" y1="420" x2="700" y2="420" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="0" y1="450" x2="700" y2="450" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="0" y1="480" x2="700" y2="480" stroke="#334155" stroke-width="1.5"/>

  <!-- Athlete Silhouette in Dynamic Sprint/Stretch Motion -->
  <circle cx="340" cy="140" r="30" fill="#FCD34D"/> <!-- Head -->
  <!-- Torso & Kinetic Energy Lines -->
  <path d="M330 170 L300 270 L380 260 Z" fill="url(#glowOrange)" filter="url(#sportsGlow)"/>
  <!-- Left Leg Forward Jump -->
  <path d="M300 270 L240 330 L180 340" stroke="#14B8A6" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Right Leg Back Power Drive -->
  <path d="M380 260 L470 320 L530 400" stroke="#14B8A6" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Arms Pump -->
  <path d="M320 180 L250 210 L220 180" stroke="#FCD34D" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M340 180 L420 200 L470 250" stroke="#FCD34D" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Telemetry Sensor Nodes / Biomarkers -->
  <circle cx="240" cy="330" r="8" fill="#F97316"/>
  <circle cx="470" cy="320" r="8" fill="#F97316"/>
  <circle cx="330" cy="170" r="8" fill="#F97316"/>

  <!-- Digital Metrics Panel 1 (Top Left) -->
  <rect x="50" y="50" width="220" height="90" rx="14" fill="rgba(30, 41, 59, 0.85)" stroke="#334155"/>
  <text x="75" y="80" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#94A3B8">POWER OUTPUT</text>
  <text x="75" y="115" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#14B8A6">840 <tspan font-size="16" fill="#64748B">Watts</tspan></text>
  <circle cx="230" cy="95" r="16" fill="rgba(20, 184, 166, 0.2)"/>
  <path d="M225 95 L229 99 L237 91" stroke="#14B8A6" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Digital Metrics Panel 2 (Bottom Right) -->
  <rect x="430" y="80" width="220" height="90" rx="14" fill="rgba(30, 41, 59, 0.85)" stroke="#334155"/>
  <text x="455" y="110" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#94A3B8">MUSCLE SYMMETRY</text>
  <text x="455" y="145" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#F97316">97.2% <tspan font-size="16" fill="#64748B">Optimal</tspan></text>
  <circle cx="610" cy="125" r="16" fill="rgba(249, 115, 22, 0.2)"/>
  <path d="M605 125 L609 129 L617 121" stroke="#F97316" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
