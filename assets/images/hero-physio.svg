<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clinic Background Window / Grid -->
  <rect width="700" height="500" rx="24" fill="url(#clinicBg)"/>
  <circle cx="580" cy="120" r="140" fill="#CCFBF1" opacity="0.6"/>
  <circle cx="120" cy="380" r="100" fill="#FFEDD5" opacity="0.5"/>

  <!-- High-tech Rehab Bed / Platform -->
  <rect x="80" y="340" width="460" height="35" rx="8" fill="#CBD5E1"/>
  <rect x="110" y="375" width="20" height="70" rx="4" fill="#94A3B8"/>
  <rect x="490" y="375" width="20" height="70" rx="4" fill="#94A3B8"/>
  <rect x="100" y="325" width="420" height="25" rx="10" fill="url(#tealGrad)"/>

  <!-- Patient on Rehab Table Exercising Leg Mobility -->
  <path d="M140 325 C140 280 180 270 210 320" fill="none" stroke="#0284C7" stroke-width="28" stroke-linecap="round"/>
  <circle cx="150" cy="270" r="22" fill="#FCD34D"/> <!-- Patient Head -->
  <!-- Patient Leg Extended Up for Stretch -->
  <line x1="220" y1="320" x2="300" y2="210" stroke="#0284C7" stroke-width="24" stroke-linecap="round"/>
  <line x1="300" y1="210" x2="330" y2="180" stroke="#FCD34D" stroke-width="18" stroke-linecap="round"/>

  <!-- Doctor / Physiotherapist Supporting & Guiding Leg Motion -->
  <path d="M370 210 L330 180" stroke="#0F766E" stroke-width="14" stroke-linecap="round"/> <!-- Therapist hands -->
  <path d="M420 330 L400 240 L450 240 L470 330 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/> <!-- Lab Coat -->
  <circle cx="425" cy="190" r="24" fill="#FCD34D"/> <!-- Therapist Head -->
  <path d="M405 175 C405 145 445 145 445 175 Z" fill="#78350F"/> <!-- Hair -->
  <!-- Therapist Legs -->
  <line x1="420" y1="330" x2="415" y2="430" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
  <line x1="450" y1="330" x2="465" y2="430" stroke="#334155" stroke-width="18" stroke-linecap="round"/>

  <!-- Interactive Biometric / Angle Overlay (98° Knee Flexion) -->
  <path d="M285 240 A 40 40 0 0 1 315 220" fill="none" stroke="#F97316" stroke-width="3" stroke-dasharray="4 3"/>
  <rect x="290" y="145" width="80" height="30" rx="6" fill="#1E293B"/>
  <text x="330" y="165" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Flex: 98°</text>

  <!-- Floating Recovery Stat Card (Left Top) -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="50" width="220" height="74" rx="14" fill="#FFFFFF"/>
    <circle cx="75" cy="87" r="22" fill="#F0FDFA"/>
    <path d="M68 87 L73 92 L83 80" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="78" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#0F172A">98.4% Recovery</text>
    <text x="110" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748B">Proven Protocols</text>
  </g>

  <!-- Floating Active Treatment Card (Right Bottom) -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="380" width="200" height="74" rx="14" fill="#FFFFFF"/>
    <circle cx="495" cy="417" r="20" fill="#FFF7ED"/>
    <circle cx="495" cy="417" r="10" fill="#F97316"/>
    <text x="530" y="408" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#0F172A">Active Session</text>
    <text x="530" y="426" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#F97316">Live ROM Analysis</text>
  </g>
</svg>
