<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for your PhysioLife patient portal account.">
  <title>Reset Password – PhysioLife Clinic</title>

  <!-- Favicon / Brand Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png?v=2026">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png?v=2026">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png?v=2026">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2026">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2026">
  <link rel="manifest" href="site.webmanifest?v=2026">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/variables.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/rtl.css" rel="stylesheet">
</head>
<body class="bg-surface-alt d-flex align-items-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand auth-brand d-inline-block" title="PhysioLife Home">
            <img src="assets/images/logo.svg" alt="PhysioLife Logo" height="46" class="logo-light">
            <img src="assets/images/logo-dark.svg" alt="PhysioLife Logo" height="46" class="logo-dark">
          </a>
        </div>

        <div class="p-4 p-md-5 bg-surface rounded-4 border border-subtle shadow-sm">
          <div class="text-center mb-4">
            <h3 class="fw-bold mb-1">Create New Password</h3>
            <p class="text-muted small">Choose a strong password with at least 8 characters.</p>
          </div>

          <form action="login.html" method="GET" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <div class="input-group">
                <input type="password" id="newPassword" class="form-control" required placeholder="New password">
                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="newPassword">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <!-- Strength bar -->
              <div class="progress mt-2" style="height: 6px;">
                <div class="progress-bar bg-success" style="width: 85%;"></div>
              </div>
              <small class="text-success small fw-semibold">Strong Password</small>
            </div>

            <div class="mb-4">
              <label class="form-label">Confirm New Password</label>
              <div class="input-group">
                <input type="password" id="confirmPassword" class="form-control" required placeholder="Confirm password">
                <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="confirmPassword">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
              <i class="fas fa-lock me-2"></i> Update Password &amp; Log In
            </button>
          </form>

          <p class="text-center small text-muted mb-0">
            <a href="login.html" class="fw-bold text-primary">&larr; Return to Sign In</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js?v=2.0.0"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
