<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your PhysioLife patient portal password.">
  <title>Forgot Password – PhysioLife Clinic</title>

  <!-- Favicon / Brand Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png?v=2026">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png?v=2026">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png?v=2026">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2026">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=2026">
  <link rel="manifest" href="site.webmanifest?v=2026">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/variables.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/rtl.css" rel="stylesheet">
</head>
<body class="bg-surface-alt min-vh-100 d-flex flex-column">

  <!-- Auth Top Navigation / Utility Bar (Theme & RTL/LTR Controls) -->
  <header class="auth-topbar w-100 py-3 px-3 px-sm-4 px-md-5">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
      <a href="index.html" class="btn-auth-back" id="backToWebsiteBtn">
        <i class="fas fa-arrow-left"></i> <span class="d-none d-sm-inline">Back to </span>Website
      </a>
      <div class="auth-topbar-controls d-flex align-items-center gap-2">
        <button class="theme-toggle-btn" type="button">
          <i class="fas fa-moon"></i>
        </button>
        <button class="rtl-toggle-btn" type="button">
          <i class="fas fa-globe"></i> <span class="dir-text">RTL</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Auth Body -->
  <main class="auth-main flex-grow-1 d-flex align-items-center py-4">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand auth-brand d-inline-block" title="PhysioLife Home">
            <img src="assets/images/logo.svg" alt="PhysioLife Logo" height="46" class="logo-light">
            <img src="assets/images/logo-dark.svg" alt="PhysioLife Logo" height="46" class="logo-dark">
          </a>
        </div>

        <div class="p-4 p-md-5 bg-surface rounded-4 border border-subtle shadow-sm">
          <div class="text-center mb-4">
            <div class="service-icon-box mx-auto text-primary bg-primary-subtle mb-3">
              <i class="fas fa-key"></i>
            </div>
            <h3 class="fw-bold mb-1">Forgot Password?</h3>
            <p class="text-muted small">Enter your registered email and we'll send a secure reset link.</p>
          </div>

          <form action="reset-password.html" method="GET" class="needs-validation" novalidate>
            <div class="mb-4">
              <label class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" class="form-control" required placeholder="name@example.com">
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
              <i class="fas fa-paper-plane me-2"></i> Send Password Reset Link
            </button>
          </form>

          <p class="text-center small text-muted mb-0">
            Remembered your password? <a href="login.html" class="fw-bold text-primary">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js?v=2.1.0"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
